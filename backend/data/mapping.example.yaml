# Соответствие подписей выгрузки каноническим кодам (PLAN.md, 2.2, 2.3, 2.8).
# Путь к файлу задаёт CATALOG_MAPPING. Без него загрузчик берёт те же значения из кода.
# Для другой выгрузки меняется этот файл, а не код. Разделы необязательны: пропущенный
# раздел берётся из встроенных значений, указанный заменяет встроенный целиком.
# Подписи сравниваются без учёта регистра, лишних пробелов и различия «е» и «ё».
# Допустимые коды тем, сфер, уровней, стадий, доступа и событий — в app/vocab.py.

version: 1

# Статусы Statuses.Title, при которых материал можно показывать. Статус нужен и в таблице
# материала, и в его записи ContentSettings; материал без такой записи не показывается.
# Флаги IsDeleted = 1, IsClosed = 1 и IsPublic = 0 скрывают материал там, где они есть.
# Если не подошёл ни один материал, каталог не загружается; ошибка называет число материалов по каждой причине.
published_statuses:
  - Опубликовано

# Канонические группы тем: код -> исходные названия Topics.Title.
# Название может входить только в одну группу.
topic_groups:
  taxes_law: [Налоги и законы, Законы]
  finance: [Финансы и учет, Финансы]
  team: [Управление командой]
  operations: [Операционка]
  marketing: [Маркетинг]
  start: [Старт бизнеса, Первые шаги, Регистрация бизнеса]
  strategy: [Стратегия и бизнес-модели]
  sales: [Продажи и переговоры, Продажи]
  tech: [ИИ и автоматизация, Технологии]
  service: [Клиентский сервис]
  stories: [Личный опыт]
  abroad: [Бизнес за рубежом]
  marketplaces: [Маркетплейсы]

# Рубрики статей ArticleSubjects.Title -> дополнительная тема статьи.
# Рубрики без кода считаются в сводке: topics_mapping.rubric_unmapped_*.
rubrics:
  ИП: start
  ООО: start
  Самозанятость: start
  Маркетплейсы: marketplaces
  Эквайринг и касса: finance
  Банковские продукты: finance

# Отрасли Industries.Title -> код сферы. Прочие метки отбрасываются и считаются в сводке.
industries:
  ECom: ecom
  Розница: retail
  Услуги: services
  Строительство и недвижимость: construction
  HoReCa: horeca
  Транспорт и логистика: logistics
  B2B: b2b
  Производство: manufacturing
  Оптовая торговля: wholesale
  B2G: b2g

# Служебные метки отраслей: не сфера бизнеса. prefixes — начало метки, например «Сегмент 003».
service_labels:
  exact: [Без опыта, С опытом, Новинки, Актуальное, Популярное, Рекомендуемое]
  prefixes: [Сегмент]

# Уровень материала из меток отраслей. Эти метки тоже служебные.
level_labels:
  Без опыта: intro
  С опытом: advanced

# Стадия из тегов Tags.Title. null — тег известен, но стадию не задаёт.
stage_tags:
  Старт бизнеса: start
  Развитие бизнеса: growth
  Налоги и законы: null

# Тип доступа CourseTypes.Title -> код. Неизвестный тип считается платным.
access_titles:
  Открытый: open
  По подписке: subscription
  Платный: paid

# Разбор длительности: единица -> минут в единице.
# «7 минут» -> 7, «1 час 30 минут» -> 90, «1,5 часа» -> 90.
duration_units:
  минута: 1
  минуты: 1
  минут: 1
  мин: 1
  час: 60
  часа: 60
  часов: 60
  ч: 60

# Коды событий истории для офлайн-оценки (PLAN.md, 2.4, 3.7):
# CourseUserBindings.Status -> событие, IsPaid = 1 -> событие paid.
history_events:
  status:
    0: view
    1: start
    2: complete
  paid: purchase
